# Порт встроенного Tomcat (8080 оставляем GlassFish из ЛР1)
server.port=8081

# Подключение к той же БД, что и в ЛР1 (скрипты в db/)
spring.datasource.url=jdbc:postgresql://localhost:5432/rag_lab
spring.datasource.username=rag_user
spring.datasource.password=rag_pass

# Шаблоны перечитываются без перезапуска (удобно при разработке)
spring.thymeleaf.cache=false

# Показывать SQL, который генерирует Hibernate
logging.level.org.hibernate.SQL=DEBUG
# Раскомментировать, чтобы видеть ещё и значения параметров запросов
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
