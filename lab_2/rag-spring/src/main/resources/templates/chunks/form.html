<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Чанк')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <h2>
        <span th:text="${chunk.id == null} ? 'Новый чанк' : 'Редактирование чанка'">Чанк</span>
        <small>документа «<span th:text="${document.title}">...</span>»</small>
    </h2>

    <form class="edit" method="post" th:object="${chunk}"
          th:action="${chunk.id == null} ? @{/documents/{d}/chunks(d=${document.id})} : @{/chunks/{id}(id=${chunk.id})}">

        <label for="chunkIndex">Номер в документе (пусто = в конец)</label>
        <input type="number" id="chunkIndex" th:field="*{chunkIndex}" size="5">
        <span class="field-error" th:if="${#fields.hasErrors('chunkIndex')}" th:errors="*{chunkIndex}"></span>

        <label for="content">Текст чанка *</label>
        <textarea id="content" th:field="*{content}" rows="8" cols="80"></textarea>
        <span class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></span>

        <p class="hint">Число токенов посчитается автоматически при сохранении.</p>

        <div class="buttons">
            <button type="submit">Сохранить</button>
            <a th:href="@{/documents/{id}/chunks(id=${document.id})}">Отмена</a>
        </div>
    </form>
</main>
</body>
</html>
