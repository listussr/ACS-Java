<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Чанки')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <div th:replace="~{fragments :: messages}"></div>
    <h2>Чанки документа «<span th:text="${document.title}">...</span>»</h2>
    <p class="hint">
        В документе <span th:text="${document.tokenCount}">0</span> токенов,
        в чанках всего <span th:text="${totalTokens}">0</span> (больше из-за перекрытия).
    </p>

    <!-- Автоматическая нарезка: бизнес-логика в DocumentService.rechunk -->
    <form class="inline" method="post" th:action="@{/documents/{id}/rechunk(id=${document.id})}"
          onsubmit="return confirm('Текущие чанки будут удалены. Продолжить?')">
        <label for="chunkSize">Размер чанка (токенов):</label>
        <input type="number" id="chunkSize" name="chunkSize" th:value="${chunkSize}" min="1" size="4">
        <label for="overlap">Перекрытие:</label>
        <input type="number" id="overlap" name="overlap" th:value="${overlap}" min="0" size="4">
        <button type="submit">Разбить на чанки заново</button>
    </form>

    <p><a th:href="@{/documents/{id}/chunks/new(id=${document.id})}">+ Добавить чанк вручную</a></p>

    <p th:if="${#lists.isEmpty(chunks)}">Чанков нет — нажмите «Разбить на чанки заново».</p>

    <table class="grid" th:unless="${#lists.isEmpty(chunks)}">
        <tr><th>№</th><th>Текст</th><th>Токенов</th><th>Действия</th></tr>
        <tr th:each="c : ${chunks}">
            <td th:text="${c.chunkIndex}">0</td>
            <td class="chunk-text" th:text="${c.content}">текст</td>
            <td th:text="${c.tokenCount}">0</td>
            <td class="actions">
                <a th:href="@{/chunks/{id}/edit(id=${c.id})}">Изменить</a>
                <form th:action="@{/chunks/{id}/delete(id=${c.id})}" method="post"
                      onsubmit="return confirm('Удалить чанк?')">
                    <button type="submit" class="danger">Удалить</button>
                </form>
            </td>
        </tr>
    </table>
</main>
</body>
</html>
