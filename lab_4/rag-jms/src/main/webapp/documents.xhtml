<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">Документы</ui:define>

    <ui:define name="content">
        <h2>Документы базы знаний</h2>

        <h:form>
            <h:dataTable value="#{documentListBean.documents}" var="doc" styleClass="grid"
                         rendered="#{not empty documentListBean.documents}">
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    #{doc.id}
                </h:column>
                <h:column>
                    <f:facet name="header">Название</f:facet>
                    #{doc.title}
                </h:column>
                <h:column>
                    <f:facet name="header">Источник</f:facet>
                    #{doc.source}
                </h:column>
                <h:column>
                    <f:facet name="header">Язык</f:facet>
                    #{doc.language}
                </h:column>
                <h:column>
                    <f:facet name="header">Токенов</f:facet>
                    #{doc.tokenCount}
                </h:column>
                <h:column>
                    <f:facet name="header">Чанков</f:facet>
                    #{doc.chunks.size()}
                </h:column>
                <h:column>
                    <f:facet name="header">Создан</f:facet>
                    <h:outputText value="#{doc.createdAt}">
                        <f:convertDateTime type="localDateTime" pattern="dd.MM.yyyy HH:mm"/>
                    </h:outputText>
                </h:column>
                <h:column>
                    <f:facet name="header">Действия</f:facet>
                    <h:link outcome="chunks" value="Чанки">
                        <f:param name="docId" value="#{doc.id}"/>
                    </h:link>
                    <h:link outcome="document-edit" value="Изменить">
                        <f:param name="id" value="#{doc.id}"/>
                    </h:link>
                    <h:commandButton value="Удалить" styleClass="danger"
                                     action="#{documentListBean.delete(doc.id)}"
                                     onclick="return confirm('Удалить документ вместе со всеми чанками?')"/>
                </h:column>
            </h:dataTable>
        </h:form>

        <h:panelGroup rendered="#{empty documentListBean.documents}">
            <p>Документов пока нет.</p>
        </h:panelGroup>
    </ui:define>
</ui:composition>
